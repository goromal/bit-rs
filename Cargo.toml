[package]
name = "bit-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Machine health and regression checks with a gRPC daemon and terminal UI"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
libc = "0.2"
prost = "0.13"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tonic = "0.12"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
axum = "0.7"
tokio-stream = { version = "0.1", features = ["net"] }

[[bin]]
name = "bitd"
path = "src/bin/bitd.rs"
[[bin]]
name = "bitctl"
path = "src/bin/bitctl.rs"
[[bin]]
name = "bit-check-internet"
path = "src/bin/internet.rs"
[[bin]]
name = "bit-check-avahi"
path = "src/bin/avahi.rs"
[[bin]]
name = "bit-check-cozy-imgedit2"
path = "src/bin/cozy_imgedit2.rs"
[[bin]]
name = "bit-check-cozy-imggen-quantized"
path = "src/bin/cozy_imggen_quantized.rs"
[[bin]]
name = "bit-check-nvidia-power"
path = "src/bin/nvidia_power.rs"
[[bin]]
name = "bit-check-ardupilot"
path = "src/bin/ardupilot.rs"
[[bin]]
name = "bit-check-ros2-topics"
path = "src/bin/ros2_topics.rs"
[[bin]]
name = "bit-check-user-units"
path = "src/bin/user_units.rs"
[[bin]]
name = "bit-check-systemd-units"
path = "src/bin/systemd_units.rs"
[[bin]]
name = "bit-check-ssh-known-hosts"
path = "src/bin/ssh_known_hosts.rs"
